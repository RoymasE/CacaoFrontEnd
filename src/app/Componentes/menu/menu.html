<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Cacao, inicio"><span class="brand-mark">C</span><span>cacao<span class="brand-dot">.</span></span></a>
  <nav aria-label="Navegación principal">
    <a *ngFor="let link of visibleLinks" [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{exact:link.path==='/'}">{{link.label}}</a>
  </nav>
  <span class="profile"><span class="avatar">{{ initials }}</span><a *ngIf="!username" routerLink="/acceso">Iniciar sesión</a><span *ngIf="username">{{ username }}<small class="role-label">{{roleLabel}}</small></span><button *ngIf="username" type="button" (click)="logout()">Salir</button></span>
</header>

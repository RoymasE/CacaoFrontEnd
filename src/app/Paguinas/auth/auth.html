<main class="auth-page"><section class="auth-card"><p class="eyebrow">CACAO · ACCESO</p><h1>{{register?'Crear cuenta de ventas':'Bienvenido'}}</h1><p>Ingresa al sistema de gestión de producción y exportación.</p><form (ngSubmit)="submit()"><label>Usuario<input name="username" [(ngModel)]="username" required minlength="3" autocomplete="username"></label><label *ngIf="register">Nombre<input name="nombre" [(ngModel)]="nombre" required></label><label *ngIf="register">Apellido<input name="apellido" [(ngModel)]="apellido" required></label><label *ngIf="register">Correo<input name="email" [(ngModel)]="email" type="email" required></label><label>Contraseña<input name="password" [(ngModel)]="password" type="password" required minlength="6" autocomplete="current-password"></label><p *ngIf="register">Las cuentas creadas desde aquí reciben el rol Ventas. Un administrador o gerente puede asignar otro rol.</p><p class="error" *ngIf="error">{{error}}</p><button [disabled]="busy">{{busy?'Procesando…':register?'Crear cuenta':'Iniciar sesión'}}</button></form><button class="switch" type="button" (click)="register=!register;error=''">{{register?'Ya tengo cuenta':'Registrar usuario de ventas'}}</button></section></main>

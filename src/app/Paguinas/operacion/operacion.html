<main class="page"><p class="eyebrow">OPERACIONES CACAO</p><div class="heading"><div><h1>{{config.title}}</h1><p>{{config.description}}</p></div><button class="refresh" type="button" (click)="load()">Actualizar ↻</button></div>
<div class="notice" *ngIf="notice">{{notice}}</div><div class="error" *ngIf="error">{{error}} <button type="button" (click)="load()">Reintentar</button></div>
<section class="panel" *ngIf="config.fields?.length"><h2>{{editingId!==null?'Editar registro':'Nuevo registro'}}</h2><form (ngSubmit)="save()"><div class="fields"><label *ngFor="let field of config.fields">{{field.label}}<select *ngIf="field.type==='select'" [name]="field.key" [(ngModel)]="draft[field.key]" required><option value="">Seleccionar</option><option *ngFor="let option of field.options" [value]="option">{{option}}</option></select><textarea *ngIf="!field.type && field.key==='observaciones'" [name]="field.key" [(ngModel)]="draft[field.key]"></textarea><input *ngIf="field.type!=='select' && !( !field.type && field.key==='observaciones')" [name]="field.key" [type]="field.type || 'text'" [(ngModel)]="draft[field.key]" [required]="field.key!=='observaciones' && !(field.key==='password' && editingId!==null)"></label></div><button class="primary" [disabled]="saving">{{saving?'Guardando…':editingId!==null?'Guardar cambios':'Guardar registro'}}</button><button *ngIf="editingId!==null" type="button" (click)="editingId=null;draft={}">Cancelar</button></form></section>
<section class="panel" *ngIf="['fermentacion','secado','granos','lotes'].includes(routeKey)"><h2>Consultar por lote</h2><form class="lookup" (ngSubmit)="routeKey==='lotes'?lookupCode():lookupLot()"><input name="lookupId" [(ngModel)]="lookupId" [placeholder]="routeKey==='lotes'?'Código oficial de lote':'ID de lote'" required><button class="primary">Consultar</button></form></section>
<section class="panel" *ngIf="detail"><div class="heading"><h2>Detalle</h2><button class="refresh" type="button" (click)="detail=null">Cerrar</button></div><pre>{{detail | json}}</pre></section>
<section class="panel"><h2>Registros</h2><p *ngIf="loading">Cargando datos del backend…</p><p *ngIf="!loading && !rows.length">No hay registros para mostrar.</p><div class="table-wrap" *ngIf="!loading && rows.length"><table><thead><tr><th *ngFor="let key of keys(rows[0])">{{key}}</th><th>Acciones</th></tr></thead><tbody><tr *ngFor="let row of rows"><td *ngFor="let key of keys(row)">{{value(row,key)}}</td><td class="actions"><button *ngIf="['usuarios','proveedores','lotes','cajones','pedidos','packing'].includes(routeKey)" (click)="showDetail(row)">Ver</button><button *ngIf="routeKey==='usuarios'||routeKey==='proveedores'" (click)="toggleActive(row)">{{row['activo']===false?'Activar':'Desactivar'}}</button><button *ngIf="routeKey==='pedidos' && row['estadoPedido']==='PENDIENTE'" (click)="confirmOrder(row)">Confirmar</button><button *ngIf="routeKey==='fermentacion' && row['lote']?.id" (click)="completeFermentation(row['lote'])">Completar lote</button><button *ngIf="routeKey==='cajones' && row['estado']!=='MANTENIMIENTO'" (click)="setBoxState(row,'MANTENIMIENTO')">Mantenimiento</button><button *ngIf="routeKey==='cajones' && row['estado']==='MANTENIMIENTO'" (click)="setBoxState(row,'DISPONIBLE')">Disponible</button></td></tr></tbody></table></div></section></main>
